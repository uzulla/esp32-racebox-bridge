# Firmware is built and flashed on the host that has ESP-IDF and the board (default: wvx).
#   mise run fw:build                  # VARIANT=c6-geek (default), c6 or s3
#   VARIANT=s3 mise run fw:flash
# Wi-Fi is configured over BLE from this machine.
#   mise run ble:status
#   mise run ble:wifi-set

[env]
VARIANT = "{{ get_env(name='VARIANT', default='c6-geek') }}"
BUILD_HOST = "{{ get_env(name='BUILD_HOST', default='wvx') }}"
IDF_EXPORT = "~/esp/esp-idf-v6.1/export.sh"
SERIAL_PORT = "{{ get_env(name='SERIAL_PORT', default='/dev/ttyACM0') }}"

[tasks."fw:sync"]
description = "rsync firmware/ and tools/variant.sh to $BUILD_HOST:racebox/"
run = """
rsync -a --delete --exclude 'build*' --exclude sdkconfig --exclude sdkconfig.old \
  --exclude sdkconfig.c6-geek --exclude sdkconfig.c6 --exclude sdkconfig.s3 \
  --exclude managed_components firmware/ $BUILD_HOST:racebox/
"""

[tasks."fw:build"]
description = "Build $VARIANT (c6-geek | c6 | s3) on $BUILD_HOST"
depends = ["fw:sync"]
run = """
. tools/variant.sh
ssh $BUILD_HOST ". $IDF_EXPORT >/dev/null 2>&1; cd ~/racebox && IDF_TARGET=$IDF_TARGET_NAME idf.py $IDF_ARGS build"
"""

[tasks."fw:flash"]
description = "Build and flash $VARIANT to $SERIAL_PORT on $BUILD_HOST"
depends = ["fw:sync"]
run = """
. tools/variant.sh
ssh $BUILD_HOST ". $IDF_EXPORT >/dev/null 2>&1; cd ~/racebox && IDF_TARGET=$IDF_TARGET_NAME idf.py $IDF_ARGS -p $SERIAL_PORT build flash"
"""

[tasks."fw:ap"]
description = "Show the soft-AP SSID/password of the last $VARIANT build (new on every build)"
run = """
. tools/variant.sh
ssh $BUILD_HOST "cat ~/racebox/build-$VARIANT/esp-idf/main/ap_credentials.h"
"""

[tasks."ble:status"]
description = "Show RaceBox link / Wi-Fi state of the bridge over BLE"
run = "uv run tools/ble-config.py status"

[tasks."ble:wifi-set"]
description = "Set Wi-Fi SSID/password over BLE (prompts)"
run = "uv run tools/ble-config.py wifi-set"

[tasks."udp:dump"]
description = "Show the UDP broadcast (summary per line); `mise run udp:dump -- -raw` for JSON"
dir = "client"
run = "go run . "
