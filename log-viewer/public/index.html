<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logger Viewer</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  :root { --bg:#0b1020; --panel:#141b30; --line:#26304d; --text:#e6ebf7; --dim:#8591b0; --accent:#00cdff; --red:#ff4646; --green:#32e678; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, "Hiragino Sans", "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; color: var(--accent); letter-spacing: .04em; }
  select, button, input[type=file]::file-selector-button { background: #1d2744; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  #meta { color: var(--dim); font-size: 12px; }
  main { flex: 1; min-height: 0; display: flex; }
  #map { flex: 1; min-width: 0; background: #0f1530; }
  aside { width: 300px; background: var(--panel); border-left: 1px solid var(--line); padding: 12px; overflow-y: auto; }
  #speed { font-size: 76px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--red); text-align: right; }
  #speed small { font-size: 18px; color: var(--dim); font-weight: 400; margin-left: 4px; }
  #clock { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; margin: 4px 0 12px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .gbar { height: 10px; background: #0f1530; border-radius: 5px; overflow: hidden; margin: 10px 0 2px; }
  .gbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), #ffb000, var(--red)); }
  .legend { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-top: 14px; }
  .legend i { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #3b6bff, #32e678, #ffd000, #ff4646); }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px; }
  #transport { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
  #transport button { min-width: 44px; }
  #seek { flex: 1; accent-color: var(--accent); }
  #pos { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 120px; text-align: right; }
  #chart { width: 100%; height: 150px; display: block; cursor: pointer; }
  label { color: var(--dim); font-size: 12px; user-select: none; }
  #drop { position: fixed; inset: 0; background: rgba(0,205,255,.15); border: 3px dashed var(--accent); display: none; align-items: center; justify-content: center; font-size: 22px; z-index: 2000; pointer-events: none; }
  #notice { color: #ffb000; font-size: 12px; }
  .arrow { width: 28px; height: 28px; transition: transform .1s linear; }
  .leaflet-container { font: inherit; }
  @media (max-width: 800px) { main { flex-direction: column; } aside { width: auto; border-left: 0; border-top: 1px solid var(--line); } #speed { font-size: 56px; } }
</style>
</head>
<body>
<header>
  <h1>LOGGER VIEWER</h1>
  <select id="files" title="logs/ のCSV"></select>
  <input type="file" id="pick" accept=".csv,text/csv">
  <span id="meta">CSV を選ぶか、ここにドロップしてください</span>
  <span id="notice"></span>
</header>
<main>
  <div id="map"></div>
  <aside>
    <div id="speed">--<small>km/h</small></div>
    <div id="clock">--</div>
    <div class="gbar"><i id="gbar"></i></div>
    <dl>
      <dt>G (重力除く)</dt><dd id="g">--</dd>
      <dt>加速度 X / Y / Z</dt><dd id="acc">--</dd>
      <dt>方位</dt><dd id="hdg">--</dd>
      <dt>高度</dt><dd id="alt">--</dd>
      <dt>GPS</dt><dd id="gps">--</dd>
      <dt>水平精度</dt><dd id="hacc">--</dd>
      <dt>ヨーレート</dt><dd id="yaw">--</dd>
      <dt>バッテリー</dt><dd id="batt">--</dd>
    </dl>
    <div class="legend"><span>0</span><i></i><span id="vmax">-- km/h</span></div>
    <p style="margin-top:16px"><label><input type="checkbox" id="follow" checked> 現在地を追う</label><br>
    <button id="fit" style="margin-top:6px">全体を表示</button></p>
  </aside>
</main>
<footer>
  <div id="transport">
    <button id="play" title="スペース">▶</button>
    <select id="rate"><option>1</option><option>2</option><option>5</option><option>10</option><option>30</option></select><label>倍速</label>
    <input type="range" id="seek" min="0" max="0" step="0.04" value="0">
    <span id="pos">0:00 / 0:00</span>
  </div>
  <canvas id="chart"></canvas>
</footer>
<div id="drop">CSV をドロップ</div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
